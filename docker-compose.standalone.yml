# =====================================================================
# Standalone (Pseudo-Distributed) Hadoop Cluster Configuration
# 单节点伪分布式 Hadoop 部署配置（极简教学版）
# =====================================================================

services:
  hadoop-standalone:
    build:
      context: .
      args:
        HADOOP_VERSION: ${HADOOP_VERSION}
        HADOOP_BASE_URL: ${HADOOP_BASE_URL:-https://repo.huaweicloud.com/apache/hadoop/common}
        HADOOP_FALLBACK_BASE_URLS: "${HADOOP_FALLBACK_BASE_URLS:-https://repo.huaweicloud.com/apache/hadoop/common https://dlcdn.apache.org/hadoop/common https://archive.apache.org/dist/hadoop/common}"
        HADOOP_DOWNLOAD_RETRY: ${HADOOP_DOWNLOAD_RETRY:-2}
        HADOOP_DOWNLOAD_RETRY_DELAY: ${HADOOP_DOWNLOAD_RETRY_DELAY:-2}
        HADOOP_DOWNLOAD_CONNECT_TIMEOUT: ${HADOOP_DOWNLOAD_CONNECT_TIMEOUT:-10}
        HADOOP_DOWNLOAD_MAX_TIME: ${HADOOP_DOWNLOAD_MAX_TIME:-0}
        HADOOP_DOWNLOAD_MIN_SPEED: ${HADOOP_DOWNLOAD_MIN_SPEED:-1024}
        HADOOP_DOWNLOAD_MIN_SPEED_TIME: ${HADOOP_DOWNLOAD_MIN_SPEED_TIME:-30}
        HADOOP_TARBALL_SHA512: ${HADOOP_TARBALL_SHA512}
        HADOOP_TARBALL_SHA512_AMD64: ${HADOOP_TARBALL_SHA512_AMD64:-}
        HADOOP_TARBALL_SHA512_ARM64: ${HADOOP_TARBALL_SHA512_ARM64:-}
        HADOOP_ARCHIVE_AMD64: ${HADOOP_ARCHIVE_AMD64:-}
        HADOOP_ARCHIVE_ARM64: ${HADOOP_ARCHIVE_ARM64:-}
        AWS_SDK_BUNDLE_VERSION: ${AWS_SDK_BUNDLE_VERSION:-2.41.30}
    # The same multi-role image powers both modes. The role is selected below.
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: hadoop-standalone
    hostname: hadoop-standalone
    environment:
      HADOOP_VERSION: ${HADOOP_VERSION}
      HADOOP_CONF_TEMPLATE_DIR: ${HADOOP_CONF_TEMPLATE_DIR}
      SSH_SHARED_DIR: ${SSH_SHARED_DIR:-/shared-ssh}
      
      # Point all services to this standalone node hostname
      NAMENODE_HOST: hadoop-standalone
      NAMENODE_RPC_PORT: ${NAMENODE_RPC_PORT:-9000}
      NAMENODE_HTTP_PORT: ${NAMENODE_HTTP_PORT:-9870}
      RESOURCEMANAGER_HOST: hadoop-standalone
      RESOURCEMANAGER_WEB_PORT: ${RESOURCEMANAGER_WEB_PORT:-8088}
      SECONDARY_NAMENODE_HOST: hadoop-standalone
      SECONDARY_NAMENODE_HTTP_PORT: ${SECONDARY_NAMENODE_HTTP_PORT:-9868}
      JOBHISTORY_HOST: hadoop-standalone
      JOBHISTORY_RPC_PORT: ${JOBHISTORY_RPC_PORT:-10020}
      JOBHISTORY_WEB_PORT: ${JOBHISTORY_WEB_PORT:-19888}
      
      DFS_REPLICATION: 1
      HADOOP_TMP_DIR: ${HADOOP_TMP_DIR:-/hadoop/tmp}
      HDFS_NAMENODE_NAME_DIR: ${HDFS_NAMENODE_NAME_DIR:-/hadoop/dfs/name}
      HDFS_DATANODE_DATA_DIR: ${HDFS_DATANODE_DATA_DIR:-/hadoop/dfs/data}
      YARN_NODEMANAGER_LOCAL_DIR: ${YARN_NODEMANAGER_LOCAL_DIR:-/hadoop/yarn/local}
      YARN_NODEMANAGER_LOG_DIR: ${YARN_NODEMANAGER_LOG_DIR:-/hadoop/yarn/logs}
      MAPRED_HISTORY_TMP_DIR: ${MAPRED_HISTORY_TMP_DIR:-/hadoop/mr-history/tmp}
      MAPRED_HISTORY_DONE_DIR: ${MAPRED_HISTORY_DONE_DIR:-/hadoop/mr-history/done}
      
      HADOOP_PROXYUSER_ROOT_HOSTS: "hadoop-standalone,localhost"
      HADOOP_PROXYUSER_ROOT_GROUPS: ${HADOOP_PROXYUSER_ROOT_GROUPS:-root}
      HADOOP_DAEMON_USER: ${HADOOP_DAEMON_USER:-hadoop}
      HADOOP_NICENESS: ${HADOOP_NICENESS:-10}
      ENABLE_SSH_USER_ENV: ${ENABLE_SSH_USER_ENV:-false}
      AUTO_RESET_DATANODE_DATA_ON_VERSION_CHANGE: ${AUTO_RESET_DATANODE_DATA_ON_VERSION_CHANGE:-false}
      
      # Specific standalone variables
      NODE_ROLE: standalone
      AUTO_FORMAT: "true"
      PRELOAD_TEST_DATA: "true"
      
      # Keep resources reasonable
      HADOOP_HEAPSIZE_MAX: ${STANDALONE_HEAPSIZE_MAX:-512}
      HADOOP_NAMENODE_OPTS: ${STANDALONE_NAMENODE_OPTS:--Xms256m -Xmx512m}
      HADOOP_DATANODE_OPTS: ${STANDALONE_DATANODE_OPTS:--Xms128m -Xmx384m}
      HADOOP_SECONDARYNAMENODE_OPTS: ${STANDALONE_SECONDARYNAMENODE_OPTS:--Xms128m -Xmx256m}
      YARN_RESOURCEMANAGER_OPTS: ${STANDALONE_RESOURCEMANAGER_OPTS:--Xms128m -Xmx384m}
      YARN_NODEMANAGER_OPTS: ${STANDALONE_NODEMANAGER_OPTS:--Xms128m -Xmx384m}
      MAPRED_HISTORYSERVER_OPTS: ${STANDALONE_HISTORYSERVER_OPTS:--Xms128m -Xmx256m}
    ports:
      # Map NameNode Ports
      - "${HOST_BIND_IP:-127.0.0.1}:${NAMENODE_HTTP_PORT:-9870}:${NAMENODE_HTTP_PORT:-9870}"
      - "${HOST_BIND_IP:-127.0.0.1}:${NAMENODE_RPC_PORT:-9000}:${NAMENODE_RPC_PORT:-9000}"
      # Map ResourceManager Web UI
      - "${HOST_BIND_IP:-127.0.0.1}:${RESOURCEMANAGER_WEB_PORT:-8088}:${RESOURCEMANAGER_WEB_PORT:-8088}"
      # Map SecondaryNameNode UI
      - "${HOST_BIND_IP:-127.0.0.1}:${SECONDARY_NAMENODE_HTTP_PORT:-9868}:${SECONDARY_NAMENODE_HTTP_PORT:-9868}"
      # Map JobHistory Server UI
      - "${HOST_BIND_IP:-127.0.0.1}:${JOBHISTORY_WEB_PORT:-19888}:${JOBHISTORY_WEB_PORT:-19888}"
    volumes:
      - ./conf:${HADOOP_CONF_TEMPLATE_DIR}:ro
      # The public image supplies Hadoop; this checkout supplies current lab behavior.
      - ./entrypoint.sh:/entrypoint.sh:ro
      - standalone_ssh_keys:${SSH_SHARED_DIR:-/shared-ssh}
      - standalone_name:${HDFS_NAMENODE_NAME_DIR}
      - standalone_data:${HDFS_DATANODE_DATA_DIR}
      - standalone_tmp:${HADOOP_TMP_DIR}
      - standalone_yarn_local:${YARN_NODEMANAGER_LOCAL_DIR}
      - standalone_yarn_logs:${YARN_NODEMANAGER_LOG_DIR}
      - standalone_history_tmp:${MAPRED_HISTORY_TMP_DIR}
      - standalone_history_done:${MAPRED_HISTORY_DONE_DIR}
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'pgrep -x sshd >/dev/null && pgrep -f [o]rg.apache.hadoop.hdfs.server.namenode.NameNode >/dev/null && pgrep -f [o]rg.apache.hadoop.hdfs.server.namenode.SecondaryNameNode >/dev/null && pgrep -f [o]rg.apache.hadoop.hdfs.server.datanode.DataNode >/dev/null && pgrep -f [o]rg.apache.hadoop.yarn.server.resourcemanager.ResourceManager >/dev/null && pgrep -f [o]rg.apache.hadoop.yarn.server.nodemanager.NodeManager >/dev/null && pgrep -f [o]rg.apache.hadoop.mapreduce.v2.hs.JobHistoryServer >/dev/null && curl -fsS http://127.0.0.1:${NAMENODE_HTTP_PORT:-9870}/ >/dev/null && curl -fsS http://127.0.0.1:${RESOURCEMANAGER_WEB_PORT:-8088}/ws/v1/cluster/info >/dev/null && safemode=\"$$(hdfs dfsadmin -safemode get 2>/dev/null)\" && [[ \"$$safemode\" == *\"Safe mode is OFF\"* ]]'"]
      interval: ${HEALTHCHECK_INTERVAL:-20s}
      timeout: ${HEALTHCHECK_TIMEOUT:-8s}
      retries: ${HEALTHCHECK_RETRIES:-15}
      start_period: ${HEALTHCHECK_START_PERIOD:-40s}
    networks:
      - hadoop-net
    # Least-privilege security settings
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  standalone_ssh_keys:
    name: ${STANDALONE_SSH_KEYS_VOLUME_NAME:-hadoop_standalone_ssh_keys}
  standalone_name:
    name: ${STANDALONE_NAME_VOLUME_NAME:-hadoop_standalone_name}
  standalone_data:
    name: ${STANDALONE_DATA_VOLUME_NAME:-hadoop_standalone_data}
  standalone_tmp:
    name: ${STANDALONE_TMP_VOLUME_NAME:-hadoop_standalone_tmp}
  standalone_yarn_local:
    name: ${STANDALONE_YARN_LOCAL_VOLUME_NAME:-hadoop_standalone_yarn_local}
  standalone_yarn_logs:
    name: ${STANDALONE_YARN_LOGS_VOLUME_NAME:-hadoop_standalone_yarn_logs}
  standalone_history_tmp:
    name: ${STANDALONE_HISTORY_TMP_VOLUME_NAME:-hadoop_standalone_history_tmp}
  standalone_history_done:
    name: ${STANDALONE_HISTORY_DONE_VOLUME_NAME:-hadoop_standalone_history_done}

networks:
  hadoop-net:
    driver: bridge
    name: ${HADOOP_NETWORK_NAME:-hadoop-net}
